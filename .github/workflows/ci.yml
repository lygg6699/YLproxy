# YLproxy CI/CD Quality Gate Workflow
#
# Triggers:
#   - Push / Pull Request to main affecting src/, tests/, scripts/, global.json
#   - Manual workflow_dispatch
#
# Jobs:
#   quality-gate  – Build Debug + Release, run tests with coverage, check coverage threshold
#   security-check – Validate no sensitive files tracked
#   e2e-tests    – Optional end-to-end tests (requires REAL_PROXY_CREDENTIALS secret)

name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'global.json'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'global.json'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_UI_LANGUAGE: en-US
  DOTNET_NOLOGO: 'true'

jobs:
  quality-gate:
    name: quality-gate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Prepare 3proxy runtime
        shell: pwsh
        run: ./scripts/prepare-runtime.ps1

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore YLproxy.sln

      - name: Validate workspace and runtime
        shell: pwsh
        run: ./scripts/validate-workspace.ps1 -WorkspaceFile ./ci.code-workspace

      - name: Seed isolated test data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path data -Force | Out-Null
          Copy-Item data/config.example.json data/config.json -Force

      - name: Build Debug with warnings as errors
        shell: pwsh
        run: dotnet build YLproxy.sln -c Debug --no-restore -warnaserror

      - name: Build Release with warnings as errors
        shell: pwsh
        run: dotnet build YLproxy.sln -c Release --no-restore -warnaserror

      - name: Run tests with coverage (excluding E2E)
        shell: pwsh
        run: |
          $testOutput = & dotnet test tests/YLproxy.Tests.csproj `
            -c Debug --no-build --no-restore `
            --filter "TestCategory!=E2E" `
            --collect:"XPlat Code Coverage" `
            --results-directory ./coverage `
            --logger "trx;LogFileName=tests.trx" 2>&1
          $testOutput | Out-String | Write-Host

          $passedMatch = [regex]::Match(($testOutput -join "`n"), 'Passed:?\s*(\d+)')
          $passed = if ($passedMatch.Success) { [int]$passedMatch.Groups[1].Value } else { 0 }
          $failedMatch = [regex]::Match(($testOutput -join "`n"), 'Failed:?\s*(\d+)')
          $failed = if ($failedMatch.Success) { [int]$failedMatch.Groups[1].Value } else { 0 }
          if ($failed -gt 0) {
            Write-Error "Test failures detected: $failed Failed, $passed Passed"
            exit 1
          }
          if ($passed -eq 0) {
            Write-Error "No tests passed. Ensure tests have correct TestCategory filter."
            exit 1
          }
          Write-Host "Tests: $passed Passed, 0 Failed"

      - name: Check Coverage Threshold (>= 80%)
        shell: pwsh
        run: |
          $coverageFiles = Get-ChildItem -Recurse -Path ./coverage -Filter "coverage.cobertura.xml" | Select-Object -First 1
          if (-not $coverageFiles) {
            Write-Warning "No coverage file found - skipping threshold check"
            return
          }
          $xml = [xml](Get-Content $coverageFiles.FullName)
          $coverage = [double]$xml.coverage.'line-rate' * 100
          Write-Host "Line coverage: $([math]::Round($coverage, 2))%"
          $threshold = 80
          if ($coverage -lt $threshold) {
            Write-Error "Coverage $([math]::Round($coverage, 2))% is below threshold $threshold%"
            exit 1
          }
          Write-Host "Coverage $([math]::Round($coverage, 2))% meets threshold $threshold%"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            coverage/**/*
          if-no-files-found: warn
          retention-days: 14

  security-check:
    name: security-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for sensitive files
        run: |
          if git ls-files | grep -q "AppSettings.json"; then
            echo "Error: AppSettings.json should not be tracked"
            exit 1
          fi
          if git ls-files | grep -q "data/config.json"; then
            echo "Error: data/config.json should not be tracked"
            exit 1
          fi

      - name: Check .gitignore patterns
        run: |
          if ! grep -q "AppSettings.json" .gitignore; then
            echo "Error: .gitignore should include AppSettings.json"
            exit 1
          fi
          if ! grep -q "data/config.json" .gitignore; then
            echo "Error: .gitignore should include data/config.json"
            exit 1
          fi

      - name: Check for build/test output artifacts
        run: |
          if git ls-files | grep -qE "(build_output|test_results|build_stdout|test_output)\.txt$"; then
            echo "Error: build/test output files should not be tracked"
            exit 1
          fi
          if git ls-files | grep -qE "(^|\/)\$null$"; then
            echo "Error: stray '\$null' file should not be tracked"
            exit 1
          fi

      - name: Check for stale branch refs
        run: |
          # Ensure only expected remote branches exist (main)
          git branch -r | grep -vE "origin/(HEAD|main)$" && {
            echo "Error: unexpected remote branches found - clean up stale branches"
            exit 1
          } || true

  e2e-tests:
    name: e2e-tests
    runs-on: windows-latest
    if: ${{ secrets.REAL_PROXY_CREDENTIALS != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Prepare 3proxy runtime
        shell: pwsh
        run: ./scripts/prepare-runtime.ps1

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore YLproxy.sln

      - name: Seed test data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path data -Force | Out-Null
          Copy-Item data/config.example.json data/config.json -Force

      - name: Build Debug
        shell: pwsh
        run: dotnet build YLproxy.sln -c Debug --no-restore -warnaserror

      - name: Run E2E tests
        shell: pwsh
        env:
          REAL_PROXY_CREDENTIALS: ${{ secrets.REAL_PROXY_CREDENTIALS }}
        run: |
          dotnet test tests/YLproxy.Tests.csproj `
            -c Debug --no-build --no-restore `
            --filter "TestCategory=E2E" `
            --results-directory TestResults `
            --logger "trx;LogFileName=e2e.trx"

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

