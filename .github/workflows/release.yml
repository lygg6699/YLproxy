name: Release

on:
  push:
    tags:
      - 'v*'            # v0.2.0, v0.2.1, 等
  workflow_dispatch:    # 手动触发
    inputs:
      tag:
        description: 'Release tag (e.g., v0.2.0)'
        required: true

permissions:
  contents: write       # 需要写入 Release 和上传附件

env:
  DOTNET_CLI_UI_LANGUAGE: en-US
  DOTNET_NOLOGO: "true"

jobs:
  build-and-release:
    name: build-and-release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Generate Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match 'refs/tags/v(.+)') {
            $version = $matches[1]
            echo "version=$version" >> $env:GITHUB_OUTPUT
            echo "tag=$($matches[0])" >> $env:GITHUB_OUTPUT
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = '${{ github.event.inputs.tag }}'
            if ($version -match '^v') { $version = $version.Substring(1) }
            echo "version=$version" >> $env:GITHUB_OUTPUT
            echo "tag=v$version" >> $env:GITHUB_OUTPUT
          } else {
            $version = '0.0.0-ci'
            echo "version=$version" >> $env:GITHUB_OUTPUT
            echo "tag=$version" >> $env:GITHUB_OUTPUT
          }
          Write-Host "Release version: $version"

      - name: Prepare 3proxy runtime
        shell: pwsh
        run: ./scripts/prepare-runtime.ps1

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore YLproxy.sln

      - name: Build Release
        shell: pwsh
        run: dotnet build YLproxy.sln --configuration Release --no-restore -warnaserror

      - name: Run tests with coverage (excluding E2E)
        shell: pwsh
        run: |
          $result = & dotnet test tests/YLproxy.Tests.csproj `
            --configuration Release --no-build --no-restore `
            --filter "TestCategory!=E2E" `
            --collect:"XPlat Code Coverage" `
            --results-directory ./coverage 2>&1
          $result | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check Coverage Threshold (≥80%)
        shell: pwsh
        run: |
          $coverageFiles = Get-ChildItem -Recurse -Path ./coverage -Filter "coverage.cobertura.xml" | Select-Object -First 1
          if (-not $coverageFiles) {
            Write-Warning "No coverage file found — skipping threshold check"
            return
          }
          $xml = [xml](Get-Content $coverageFiles.FullName)
          $coverage = [double]$xml.coverage.'line-rate' * 100
          Write-Host "Line coverage: $([math]::Round($coverage, 2))%"
          $threshold = 80
          if ($coverage -lt $threshold) {
            Write-Error "Coverage $([math]::Round($coverage, 2))% is below threshold $threshold%"
            exit 1
          }
          Write-Host "✅ Coverage $([math]::Round($coverage, 2))% meets threshold $threshold%"

      - name: Generate SBOM
        shell: pwsh
        run: |
          # 使用 SPDX SBOM 生成方式：通过 .NET SDK 内置功能
          dotnet tool install --global Microsoft.Sbom.DotNetTool --version 3.0.0 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "SBOM tool install failed — skipping SBOM generation"
            return
          }
          $version = "${{ steps.version.outputs.version }}"
          if ([string]::IsNullOrEmpty($version)) { $version = "0.0.0-ci" }
          sbom-tool generate `
            -b ./publish `
            -o ./sbom `
            -pn YLproxy `
            -pv $version `
            -ps YLproxy-Team `
            -ns https://github.com/lygg6699/YLproxy 2>&1 | Out-String | Write-Host
          Write-Host "SBOM generated at ./sbom"

      - name: Create release package
        shell: pwsh
        run: ./build/publish.ps1 -Configuration Release -CreateZip

      - name: Generate Installer (WiX)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # 安装 WiX 工具集
          dotnet tool install --global wix --version 5.0.0 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "WiX toolset install failed — skipping installer generation"
            return
          }
          
          $version = "${{ steps.version.outputs.version }}"
          if ([string]::IsNullOrEmpty($version)) { $version = "0.0.0" }
          
          # 创建 WiX 项目文件
          $wixProjectPath = "./installer/Product.wxs"
          $installerDir = "./installer"
          if (-not (Test-Path $installerDir)) { New-Item -ItemType Directory -Path $installerDir | Out-Null }
          
          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="YLproxy" Language="1033" Version="$($version)" Manufacturer="YLproxy-Team" UpgradeCode="d1a2b3c4-d5e6-f7g8-h9i0-j1k2l3m4n5o6">
              <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine" />
              
              <MajorUpgrade DowngradeErrorMessage="A newer version of YLproxy is already installed." />
              
              <MediaTemplate />
              
              <Feature Id="ProductFeature" Title="YLproxy" Level="1">
                <ComponentGroupRef Id="ProductComponents" />
              </Feature>
            </Product>
            
            <Fragment>
              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFilesFolder">
                  <Directory Id="INSTALLFOLDER" Name="YLproxy" />
                </Directory>
              </Directory>
            </Fragment>
            
            <Fragment>
              <ComponentGroup Id="ProductComponents" Directory="INSTALLFOLDER">
                <Component Id="MainExecutable">
                  <File Source="$(var.publish)\YLproxy.GUI.exe" />
                </Component>
                <Component Id="ConfigurationFiles">
                  <File Source="$(var.publish)\AppSettings.example.json" />
                  <File Source="$(var.publish)\global.json" />
                </Component>
                <Component Id="RuntimeFiles">
                  <File Source="$(var.publish)\runtime\3proxy\bin64\3proxy.exe" />
                  <File Source="$(var.publish)\runtime\3proxy\cfg\*.cfg" />
                </Component>
              </ComponentGroup>
            </Fragment>
          "@ | Out-File -FilePath $wixProjectPath -Encoding UTF8
          
          # 编译安装包
          wix project build $wixProjectPath -c release -o ./installer
          
          Write-Host "Installer generated at ./installer/YLproxy.msi"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            build/YLproxy-*.zip
            installer/*.msi
            sbom/**/*
          generate_release_notes: true
          draft: true                    # 创建草稿，人工审核后发布

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/**/*
          if-no-files-found: warn
          retention-days: 14

