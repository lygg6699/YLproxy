name: Release

on:
  push:
    tags:
      - 'v*'            # v0.2.0, v0.2.1, 等
  workflow_dispatch:    # 手动触发
    inputs:
      tag:
        description: 'Release tag (e.g., v0.2.0)'
        required: true

permissions:
  contents: write       # 需要写入 Release 和上传附件

env:
  DOTNET_CLI_UI_LANGUAGE: en-US
  DOTNET_NOLOGO: "true"

jobs:
  build-and-release:
    name: build-and-release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Prepare 3proxy runtime
        shell: pwsh
        run: ./scripts/prepare-runtime.ps1

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore YLproxy.sln

      - name: Build Release
        shell: pwsh
        run: dotnet build YLproxy.sln --configuration Release --no-restore -warnaserror

      - name: Run tests (excluding E2E)
        shell: pwsh
        run: |
          $result = & dotnet test tests/YLproxy.Tests.csproj `
            --configuration Release --no-build --no-restore `
            --filter "TestCategory!=E2E" 2>&1
          $result | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Create release package
        shell: pwsh
        run: ./build/publish.ps1 -Configuration Release -CreateZip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: build/YLproxy-*.zip
          generate_release_notes: true
          draft: true                    # 创建草稿，人工审核后发布</｜DSML｜parameter>
