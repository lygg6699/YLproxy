# YLproxy CodeQL 安全分析工作流
#
# 功能：
# - 在 push 到 main 和 PR 到 main 时自动运行 CodeQL 分析
# - 扫描 C# 代码中的安全漏洞和代码质量问题
# - 将安全事件上传到 GitHub Security 选项卡
#
# 触发条件：
# - push 到 main 分支
# - pull_request 到 main 分支
# - 手动触发 (workflow_dispatch)

name: CodeQL

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (C#)
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # 可以在此处添加 config-file 自定义查询
          # config-file: ./.github/codeql/codeql-config.yml

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Prepare 3proxy runtime
        shell: pwsh
        run: ./scripts/prepare-runtime.ps1

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore YLproxy.sln

      - name: Build (Release, warnings as errors)
        shell: pwsh
        run: dotnet build YLproxy.sln --configuration Release --no-restore -warnaserror

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

